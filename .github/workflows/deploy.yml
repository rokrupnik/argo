name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # commit workflowa za cene (GITHUB_TOKEN) ne sproži deploya,
    # zato se deploy s svežimi cenami požene tudi sam, pol ure kasneje
    - cron: '35 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # sveže cene ob vsakem deployu; ob napaki obdržimo cene iz repoja
      - run: node scripts/fetch-prices.mjs || echo "Cen ni bilo mogoče osvežiti, uporabim obstoječe"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
